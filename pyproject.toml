[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "voodoo-store"
version = "0.1.0"
description = "Embedded application state engine for Python, backed by Voodoo Store Rust core"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Helder Perez" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Operating System :: OS Independent",
]

[tool.maturin]
manifest-path = "crates/voodoo-store-python/Cargo.toml"
python-source = "python"
module-name = "voodoo_store._native"
bindings = "pyo3"
