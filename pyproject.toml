[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "voodoo-store"
version = "0.2.0"
description = "Embedded application state engine for Python, backed by Voodoo Store Rust core"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Helder Perez" }]
keywords = ["embedded", "database", "state", "runtime", "rust"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/helderperez-dev/voodoo-store"
Repository = "https://github.com/helderperez-dev/voodoo-store"
Issues = "https://github.com/helderperez-dev/voodoo-store/issues"

[tool.maturin]
manifest-path = "crates/voodoo-store-python/Cargo.toml"
python-source = "python"
module-name = "voodoo_store._native"
bindings = "pyo3"
