[package]
name = "voodoo-store-python"
version = "0.3.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "_native"
path = "src/binding.rs"
crate-type = ["cdylib"]
# The binding is validated through maturin-built wheels and the Python suite.
# Disabling Rust's standalone lib test harness avoids attempting to link a
# second executable against Python's symbols during `cargo test --workspace`.
test = false
bench = false

[dependencies]
pyo3 = { version = "0.28", features = ["extension-module", "abi3-py39", "multiple-pymethods"] }
voodoo-store-core = { path = "../voodoo-store-core" }
