name: Python Release

on:
  workflow_dispatch:
  push:
    tags:
      - "python-v*"

jobs:
  wheels:
    name: wheel (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64
            manylinux: auto
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64
            manylinux: auto
          - name: macos-arm64
            os: macos-15
            target: aarch64
            manylinux: ""
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64
            manylinux: ""
          - name: windows-x86_64
            os: windows-latest
            target: x64
            manylinux: ""

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: ${{ matrix.manylinux }}

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: voodoo-store-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build source distribution
        run: |
          python -m pip install "maturin>=1.9,<2"
          maturin sdist --out dist
      - name: Upload source distribution
        uses: actions/upload-artifact@v4
        with:
          name: voodoo-store-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: publish to PyPI
    if: startsWith(github.ref, 'refs/tags/python-v')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/voodoo-store/
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          pattern: voodoo-store-*
          path: dist
          merge-multiple: true

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
