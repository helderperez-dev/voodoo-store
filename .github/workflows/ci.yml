name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  audit:
    name: RustSec dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Validate observability contract
        run: python scripts/check_observability_contract.py
      - name: Validate observability dashboard
        run: python scripts/check_observability_dashboard.py
      - name: Upload validated Grafana dashboard
        uses: actions/upload-artifact@v7
        with:
          name: voodoo-store-grafana-dashboard
          path: docs/OBSERVABILITY_GRAFANA_DASHBOARD.json
          if-no-files-found: error
      - name: Format
        run: cargo fmt --all -- --check
      - name: C ABI consumer smoke
        run: python scripts/c_abi_smoke.py
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test Rust workspace
        run: cargo test --workspace --exclude voodoo-store-python

  python:
    name: python ${{ matrix.python-version }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Build and install Python package
        run: python -m pip install . pytest
      - name: Audit Python dependencies
        run: |
          python -m pip install "pip-audit==2.10.1"
          python -m pip_audit --progress-spinner off
      - name: Test Python package
        run: python -m pytest python/tests -q

  msrv:
    name: MSRV 1.85
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
      - uses: Swatinem/rust-cache@v2
      - name: Check workspace on MSRV
        run: cargo check --workspace --all-targets
