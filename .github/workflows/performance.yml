name: Store performance

on:
  schedule:
    - cron: "17 3 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore retained benchmark history
        uses: actions/cache/restore@v4
        with:
          path: /tmp/voodoo-store-performance-history.jsonl
          key: voodoo-store-performance-${{ github.run_id }}
          restore-keys: voodoo-store-performance-
      - name: Build and install binding
        run: python -m pip install .
      - name: Run retained benchmark budget
        run: |
          python scripts/benchmark_store.py --iterations 1000 --max-ms 30000 \
            --result /tmp/voodoo-store-performance.json \
            --history /tmp/voodoo-store-performance-history.jsonl \
            | tee /tmp/voodoo-store-performance.stdout.json
          python scripts/benchmark_store.py \
            --trend /tmp/voodoo-store-performance-history.jsonl \
            > /tmp/voodoo-store-performance-trend.json
      - name: Upload benchmark result
        uses: actions/upload-artifact@v4
        with:
          name: voodoo-store-performance
          path: |
            /tmp/voodoo-store-performance.json
            /tmp/voodoo-store-performance-history.jsonl
            /tmp/voodoo-store-performance.stdout.json
            /tmp/voodoo-store-performance-trend.json
      - name: Retain benchmark history for the next run
        uses: actions/cache/save@v4
        with:
          path: /tmp/voodoo-store-performance-history.jsonl
          key: voodoo-store-performance-${{ github.run_id }}
