name: Store Windows recovery

on:
  workflow_dispatch:
  schedule:
    - cron: "29 4 * * 6"

permissions:
  contents: read

jobs:
  recovery:
    name: Windows crash and torn-write recovery
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rust forced-exit and partial-write tests
        shell: bash
        run: |
          cargo test -p voodoo-store-core --test process_crash --test recovery_faults
          cargo test -p voodoo-store-core --test state_model
          cargo test -p voodoo-store-core activation --lib
      - name: Build and install Python binding
        shell: bash
        run: python -m pip install . pytest
      - name: Python corruption and restore tests
        shell: bash
        run: python -m pytest -q python/tests/test_operations.py python/tests/test_store.py
