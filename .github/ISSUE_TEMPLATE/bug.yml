name: Store bug report
description: Report a reproducible Store or binding issue.
title: "bug(store): "
labels: [bug, store]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Include Store version, format version, OS, and binding.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
    validations:
      required: true
